<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>С днём рождения, Юля!</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ФОН -->
    <div class="bg-layer"></div>

    <!-- ЧАСТИЦЫ -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="container">

        <!-- Заголовок -->
        <h1 class="title">
            Подожди-ка... <span class="emoji">🎂</span>
        </h1>

        <!-- Подзаголовок -->
        <p class="subtitle">Это не спам · Это не вирус</p>

        <!-- Гифка -->
        <div class="gif-wrapper">
            <!-- ⬇️ СЮДА ВСТАВЬ СВОЮ ГИФКУ ⬇️ -->
            <img
                src="img/gif1.gif"
                alt="Смешная гифка"
                loading="lazy"
            />
            <!-- ⬆️ КОНЕЦ ВСТАВКИ ГИФКИ ⬆️ -->
        </div>

        <!-- Текст -->
        <div class="text-wrapper">
            <div class="text-content" id="typewriter-content">
                <span id="text-target"></span><span class="cursor"></span>
            </div>
        </div>

        <!-- Кнопка -->
        <div class="btn-wrapper">
            <a href="page2.html" class="btn-next" id="nextBtn">
                <span>
                    Заглянуть, что там дальше
                    <span class="arrow">→</span>
                </span>
            </a>
        </div>

        <!-- Прогресс -->
        <div class="progress-bar">
            <div class="fill fill-25"></div>
        </div>

    </div>

    <script src="js/main.js"></script>
    <script>
        // Запускаем печатную машинку
        const text = 'Писал для тебя поздравление, но решил, что ты заслуживаешь не просто "с др", а целое приключение. Ну что, погнали?';
        const target = document.getElementById('text-target');
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                target.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, 25 + Math.random() * 20);
            } else {
                setTimeout(() => {
                    const cursor = document.querySelector('.cursor');
                    if (cursor) cursor.style.display = 'none';
                }, 2000);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(typeWriter, 1200);
        });
    </script>

</body>
</html>
